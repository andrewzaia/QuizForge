name: Validate QuizForge question bank

on:
  pull_request:
    paths:
      - 'questions*.js'
      - 'scripts/validate-questions.mjs'
      - 'index.html'
  push:
    branches: [main]
    paths:
      - 'questions*.js'
      - 'scripts/validate-questions.mjs'
      - 'index.html'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all question banks
        run: node scripts/validate-questions.mjs
